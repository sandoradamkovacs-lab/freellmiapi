name: Desktop release recovery

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  linux-recovery:
    name: Recover Linux and validate release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.16.22
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - name: Verify pinned release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b6add3e415bebe6ce93fd42cc8de8581d66ca89d
          node -e "const a=require('./desktop/package.json'),b=require('./desktop/package-lock.json');if(a.version!=='0.16.22'||b.version!==a.version||b.packages[''].version!==a.version)process.exit(1)"
          echo "Verified source commit b6add3e415bebe6ce93fd42cc8de8581d66ca89d, app 0.16.22"
      - name: Install dependencies with bounded download retries
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; fi
              if [ "$attempt" -eq 4 ]; then return 1; fi
              echo "::warning::Download/install attempt $attempt failed; retrying within this build"
              sleep $((attempt * 10))
            done
          }
          retry npm ci
          retry npm --prefix desktop ci
      - name: Run desktop tests
        run: npm --prefix desktop test
      - name: Build pinned release bundles
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA=b6add3e415bebe6ce93fd42cc8de8581d66ca89d
          npm run build -w client
          npm --prefix desktop run build:all
          npm --prefix desktop run stage:client
      - name: Package Linux with bounded download retries
        shell: bash
        run: |
          set -euo pipefail
          mv package.json "$RUNNER_TEMP/root-package.json"
          cd desktop
          for attempt in 1 2 3 4; do
            if npx --no-install electron-builder --linux --x64 --publish never; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            echo "::warning::Packaging download attempt $attempt failed; retrying with caches preserved"
            sleep $((attempt * 10))
          done
      - name: Preserve recovered Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-installer
          path: |
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.tar.xz
            desktop/dist-electron/*.deb
            desktop/dist-electron/*.rpm
            desktop/dist-electron/latest-linux.yml
          if-no-files-found: error
      - name: Download successful original signed Mac and Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42476646496
          pattern: '*-installer*'
          path: artifacts
      - name: Verify original signed Mac artifacts and combine update manifest
        run: |
          node desktop/scripts/merge-mac-update-metadata.mjs \
            artifacts/macos-installer-arm64 artifacts/macos-installer-x64 \
            artifacts/latest-mac.yml
      - name: Verify Linux and Windows update hashes and versions
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { hashFile } from './desktop/scripts/refresh-mac-update-metadata.mjs';
          const yaml = createRequire(path.resolve('desktop/package.json'))('js-yaml');
          for (const [directory, filename] of [['desktop/dist-electron','latest-linux.yml'],['artifacts/windows-installer','latest.yml']]) {
            const manifest = yaml.load(fs.readFileSync(path.join(directory, filename), 'utf8'), { schema: yaml.JSON_SCHEMA });
            assert.equal(manifest.version, '0.16.22');
            assert(manifest.files.length > 0);
            for (const file of manifest.files) {
              assert.equal(path.basename(file.url), file.url);
              const artifact = path.join(directory, file.url);
              assert.equal(fs.statSync(artifact).size, file.size);
              assert.equal(hashFile(artifact), file.sha512);
            }
            assert(manifest.files.some(file => file.url === manifest.path && file.sha512 === manifest.sha512));
            console.log('Verified hashes and version: ' + filename);
          }
          JS
      - name: Attach verified payloads and manifests to existing draft only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh release view v0.16.22 --json isDraft --jq .isDraft)" = true
          test "$(gh release view v0.16.22 --json targetCommitish --jq .targetCommitish)" = b6add3e415bebe6ce93fd42cc8de8581d66ca89d
          gh release upload v0.16.22 \
            desktop/dist-electron/*.AppImage desktop/dist-electron/*.tar.xz \
            desktop/dist-electron/*.deb desktop/dist-electron/*.rpm \
            artifacts/macos-installer-*/*.dmg artifacts/macos-installer-*/*.zip \
            artifacts/macos-installer-*/*.blockmap --clobber
          gh release upload v0.16.22 desktop/dist-electron/latest-linux.yml artifacts/latest-mac.yml --clobber
          echo "Recovery complete. Draft remains unpublished for independent final verification."
